name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Job id stays "test": it is the required status check on main, and renaming
  # it would leave branch protection waiting forever for a check that no longer
  # reports. The GDScript job below is additive.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

      # The GitHub About carries the tool count, and it drifted to fifteen
      # releases out of date because nothing checked it. Read-only, so the
      # default token is enough; it self-skips where gh is unavailable.
      - name: Check the GitHub About is in step with the tool count
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sync-about.mjs --check

  gdscript:
    # The Node suite exercises the bridge and the tool registry, but every
    # GDScript handler — the half that actually mutates scenes — only runs
    # inside Godot. This job downloads a real headless Godot and runs the
    # on-disk tool tests against it, so a broken handler fails CI instead of
    # waiting to be found by hand.
    #
    # Matrixed because engine drift is otherwise invisible until a user hits it.
    # Both failures this project has had of that shape — NavigationRegion2D's
    # get_bounds() moving, and the advertised 4.3 minimum never actually working
    # in editor mode — were found by hand, late. `godot-minimum` is the version
    # the README promises; `godot-latest` is the one users are actually on.
    # fail-fast is off so a break in one version still reports the other.
    strategy:
      fail-fast: false
      matrix:
        include:
          - godot: "4.5"
            label: godot-minimum
          - godot: "4.7"
            label: godot-latest
    name: gdscript (${{ matrix.label }} ${{ matrix.godot }})
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: ${{ matrix.godot }}
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot ${{ env.GODOT_VERSION }} (headless)
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o godot.zip "$url"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          ./godot --version

      - name: Sync addon into the test fixture
        # The fixture keeps its own copy of the addon (it is what the tests
        # load); mirror the repo's addon over it so CI tests the current code.
        run: |
          set -euo pipefail
          fixture="mcp-server/src/tests/fixtures/e2e-project"
          rm -rf "$fixture/addons/godot_mcp"
          mkdir -p "$fixture/addons"
          cp -r addons/godot_mcp "$fixture/addons/godot_mcp"
          find "$fixture/addons" -name '*.uid' -delete

      - name: Build the class cache
        # `extends SceneToolBase` and the other class_name lookups only resolve
        # once Godot has imported the project, so this pass is required before
        # running anything with -s.
        run: ./godot --headless --path mcp-server/src/tests/fixtures/e2e-project --import
        # A cold import prints resource warnings and can report a nonzero exit
        # even when it succeeded; the test run below is the real gate.
        continue-on-error: true

      - name: Parse every addon script
        # The logic tests only preload the handlers they exercise; this catches a
        # syntax error in a file none of them happen to load.
        run: ./godot --headless --path mcp-server/src/tests/fixtures/e2e-project -s res://tests/parse_all.gd

      - name: Run GDScript handler tests
        run: ./godot --headless --path mcp-server/src/tests/fixtures/e2e-project -s res://tests/run_tests.gd

      - name: Check send_input actually reaches Input
        # Runs as a SCENE, not with -s: the Input singleton only advances its
        # action state on real frames. send_input was once reported broken on
        # the strength of a jump that never fired; this answers that in seconds.
        run: ./godot --headless --path mcp-server/src/tests/fixtures/e2e-project res://tests/input_delivery.tscn

      # The live-scene half — scene open in the editor, tools mutating the real
      # node tree — is where this project's hardest invariants live (no clobber,
      # no partial write, undo actually registered). It only runs with a real
      # editor, so it belongs in this job: the `test` job has no Godot and skips
      # it. Without this the harness would sit green-by-skipping.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install Xvfb
        # Part of the harness plays a scene. The editor itself runs --headless,
        # but the game it launches is a separate process that does NOT inherit
        # that flag, so on a runner with no display it cannot open a window and
        # the runtime-activity tests would fail for an environmental reason.
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Check scene rendering produces a real image
        # Under xvfb because --headless uses the dummy driver: the viewport
        # produces no image at all, so this would pass by rendering nothing.
        run: xvfb-run -a ./godot --path mcp-server/src/tests/fixtures/e2e-project -s res://tests/render_preview.gd

      - name: Run the live-scene e2e harness
        working-directory: mcp-server
        env:
          GODOT_BIN: ${{ github.workspace }}/godot
        run: |
          npm ci
          npm run build
          xvfb-run -a npx vitest run src/tests/e2e-godot.test.ts
